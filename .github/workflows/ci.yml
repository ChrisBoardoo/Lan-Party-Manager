name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        # xdist: ~20 s instead of 13 min (the fixture no longer rebuilds the
        # schema per test, bcrypt runs at 4 rounds under test — Q-5).
        run: python -m pytest -n auto

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.14.5
      - name: ruff check
        working-directory: backend
        run: ruff check .

  dependency-audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory for the first month (O-3 of the 2026-10-20 review): the report
    # shows in the job log and the summary; make it blocking once the
    # backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build  # runs `tsc && vite build`

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run test

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rules of hooks as errors, accessibility and unused code as warnings
    # (frontend/eslint.config.js) — tsc stays the typing gate in frontend-build.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint

  arm64-migration-smoke-test:
    name: Alembic migrations on arm64 (Raspberry Pi parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Backend-tests above never actually runs a migration file (conftest.py
    # builds the schema straight from Base.metadata), and even a native
    # ubuntu-latest run of Alembic wouldn't reproduce this: a 2026-09-14
    # production incident had a migration's `op.add_column(..., server_
    # default=sa.func.now())` work fine against the newer SQLite bundled
    # with dev/CI x86 Python, but raise "Cannot add a column with
    # non-constant default" against the OLDER SQLite bundled in the arm64
    # python:3.11-slim image actually deployed on a Raspberry Pi 4 — see
    # backend/alembic/versions/0024_craving_chat_v2.py and backend/tests/
    # test_migrations.py's static guard for the fix and the general-purpose
    # check. This job is the one thing that runs the *real* migration chain
    # inside the *real* target architecture's SQLite build, which is the
    # only way to actually catch this class of bug before a Pi does.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - name: Run the full Alembic chain twice inside an arm64 container
        run: |
          docker run --rm --platform linux/arm64/v8 \
            -v "${{ github.workspace }}/backend:/app" -w /app \
            -e SECRET_KEY=ci-secret-not-for-production \
            -e DATABASE_URL=sqlite:////tmp/arm-smoke.db \
            python:3.11-slim bash -c "
              set -e
              pip install -q -r requirements.lock
              python -c 'from db_migrate import run_migrations; run_migrations()'
              python -c 'from db_migrate import run_migrations; run_migrations()'
            "

  i18n-parity:
    name: i18n EN/FR parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check translation parity
        run: python scripts/check_i18n_parity.py

  version-sync:
    name: Version sync across files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check version consistency
        run: python scripts/check_version_sync.py
