[package]
name = "lpm-desktop"
version = "1.5.3"
description = "LAN Party Manager desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tokio = { version = "1", features = ["time", "net", "io-util"] }
notify-rust = "4"
open = "5"
getrandom = "0.2"
# Game time (gametime.rs): the process list, without the rayon thread pool.
sysinfo = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
# Game time: where Steam is installed (HKCU\Software\Valve\Steam).
winreg = "0.55"
