# Used by the /api/ location's WebSocket upgrade below: nginx only forwards the
# Upgrade header for connections that actually asked for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # No nginx version in Server: and error pages (D-9 of the 2026-10-20 review).
    server_tokens off;

    # The bundle is one ~1 MB JS file; without this it left the Pi uncompressed
    # over the venue's Wi-Fi, twenty phones at a time (F-4 of the 2026-10-20
    # review): ~290 KB gzipped. Media is already compressed and isn't listed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;

    # 1 MB everywhere except the upload routes inside /api/ below. The largest
    # JSON bodies are LoL game captures (~64 KB). FastAPI decodes a JSON body
    # before checking auth, so the old blanket 110m let anyone post 110 MB to
    # /api/auth/login and swell the Pi's memory ~25x while decoding it.
    client_max_body_size 1m;

    # Use Docker's internal DNS so resolution is deferred to request time,
    # not at nginx startup (avoids "host not found in upstream" on cold start)
    resolver 127.0.0.11 valid=30s;

    # The client IP the backend's login rate limits key on. X-Forwarded-For is
    # only believed from the reverse proxy in front (the set_real_ip_from lines
    # this include holds, generated at container start from LPM_TRUSTED_PROXIES
    # by nginx-real-ip.sh); from anyone else, the connection's own address is the
    # client. Recursive: the rightmost address that isn't the proxy's wins, so
    # whatever a client puts in the header itself — always to the left of what
    # its proxy appends — is ignored.
    include /etc/nginx/lpm-real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Server level, not inside /api/: rewrite directives of an outer location
    # don't run when a nested location matches, and the upload location below
    # needs this too.
    set $upstream http://backend:8000;

    # Who may put the app in a frame (clickjacking): itself, and the desktop
    # app's shell — http://tauri.localhost on Windows, tauri://localhost on the
    # other platforms, http://localhost:1420 under `tauri dev`. Applied in each
    # HTML location below: a location with its own add_header doesn't inherit
    # the server's.
    set $frame_policy "frame-ancestors 'self' http://tauri.localhost tauri://localhost http://localhost:1420";
    # Two more headers every HTML location repeats (add_header isn't inherited
    # into a location that sets its own): no referrer leaks across origins, and
    # no MIME sniffing. The share tokens are in the #fragment, never in Referer.
    set $referrer_policy "strict-origin-when-cross-origin";

    # The two public, token-authorized share pages. They're deliberately
    # crawlable (a robots.txt Disallow would stop the crawler ever *fetching*
    # them, so it would never see this header — and a disallowed URL can still be
    # indexed URL-only if someone links to it). Let the crawler in and tell it no.
    #
    # This header is the authoritative mechanism: it works on crawlers that don't
    # execute JS. useNoindex() covers `vite dev` and non-nginx deploys.
    location = /setup/shared {
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy $frame_policy always;
        add_header Referrer-Policy $referrer_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /recap/shared {
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy $frame_policy always;
        add_header Referrer-Policy $referrer_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Vite hashes every file under /assets/ (index-<hash>.js): a new build is a
    # new name, so these can be cached for a year. index.html must NOT be: it
    # points at the current hashes, and a browser keeping an old copy after a
    # deploy loads a script that no longer exists — a blank page until a hard
    # reload (the WebView2 cache trap of CLAUDE.md, browser edition).
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Content-Security-Policy $frame_policy always;
        add_header Referrer-Policy $referrer_policy always;
        add_header X-Content-Type-Options nosniff always;
        # The SPA shell and everything else not under /assets/: revalidate each
        # time (ETag/Last-Modified still make that a cheap 304).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append. $proxy_add_x_forwarded_for kept whatever the
        # client sent in front of the real address, and uvicorn takes the
        # LEFTMOST entry — so any client could pick its own IP and never hit a
        # rate limit (S1). $remote_addr is already the real client (realip above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the /api/activity/ws WebSocket route — plain HTTP proxying
        # doesn't forward the Upgrade handshake on its own. $connection_upgrade
        # (defined via the map{} above) keeps this location degrading to a
        # normal proxied connection, not an error, for ordinary HTTP requests.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        # The only routes that take file bodies. The backend caps each one itself
        # (12 MB images, 20 MB banners, 100 MB media — uploads.read_capped); this
        # only lets them through. Inherits the proxy_set_header lines above, but
        # proxy_pass is never inherited, hence repeated. A new upload route must
        # be added here or it 413s: backend/tests/test_nginx_body_limits.py fails
        # until it is.
        location ~ ^/api/(media/upload|setup/me/photos|events/\d+/cover|prizes/\d+/photo|sponsors/\d+/banner|trophies/\d+/image|users/\d+/avatar)$ {
            client_max_body_size 110m;
            proxy_pass $upstream$request_uri;
        }

        # Restoring a backup: the archive holds every photo and video, so it has
        # no fixed ceiling (a 200 MB backup 413'd under the old 110m). Uncapped
        # here and streamed to the backend as it arrives (no request buffering:
        # nginx would otherwise spool the whole file first). Safe to leave open:
        # the backend takes the raw body, checks the admin token *before* reading
        # it, and checks the free disk space against its length — see
        # router_backup.import_backup and tests/test_nginx_body_limits.py.
        location = /api/backup/import {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass $upstream$request_uri;
        }
    }

    location /uploads/ {
        alias /app/uploads/;
        # `immutable` is why every upload gets a fresh uuid filename on rotate —
        # the filename IS the cache key. See uploads.rotate_image_file.
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Setup photos and recap media reachable from a share link shouldn't turn
        # up in image search on their own.
        add_header X-Robots-Tag "noindex" always;
    }
}
